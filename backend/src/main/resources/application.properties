# =====================================================================
# ShopSphere Application Properties
# =====================================================================

spring.application.name=shopsphere-backend
server.port=${PORT:8080}

# Database Configuration (Supports MySQL and PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/shopsphere_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:thala7}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:9a7c8e5f3b2d1a4c6e8f0b2d4f6a8c0e2a4b6c8e0f2a4b6c8e0f2a4b6c8e0f2a}
app.jwt.expiration-ms=86400000

# Razorpay Configuration (Sandbox / Test Mode)
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_shopsphere_mock_id}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:rzp_test_shopsphere_mock_secret}
razorpay.mock-mode=true

# Mail Notification Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
