databases:
  # =========================================================================
  # Render Managed PostgreSQL Database (Free Tier)
  # Provisioned and managed 100% automatically by Render — Zero manual setup!
  # =========================================================================
  - name: shopsphere-db
    databaseName: shopsphere
    user: shopsphere_user
    plan: free
    region: oregon

services:
  # =========================================================================
  # 1. ShopSphere Backend (Spring Boot 3 + Java 22 via Docker)
  # =========================================================================
  - type: web
    name: shopsphere-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/products
    envVars:
      - key: PORT
        value: 8080
      - key: JAVA_OPTS
        value: -Xmx320m -Xms128m -XX:+UseSerialGC -Xss512k
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: shopsphere-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        value: rzp_test_shopsphere_mock_id
      - key: RAZORPAY_KEY_SECRET
        value: rzp_test_shopsphere_mock_secret

  # =========================================================================
  # 2. ShopSphere Frontend (React 18 + Vite SPA)
  # =========================================================================
  - type: web
    name: shopsphere-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Set to https://<your-backend-name>.onrender.com/api
